# Link-check exclusions. Keep this list short and justified: every pattern here
# is a link CI does not verify, and the point of the check is that a dead link
# in the launch pages fails a build rather than a visitor.
#
# Not excluded any more, deliberately:
#   github.com/homeaccounting/*  — the repos are public (tracker#11), so the
#     SECURITY.md, CLA.md and README deep links the site depends on are checked
#   www.homeaccounting.com       — the DNS cutover happened; canonical, sitemap
#     and robots self-references are checked
#   demo.homeaccounting.com      — the sandbox is live (tracker#71)
exclude = [
  # Discord and Telegram reject HEAD from CI runners, so these cannot be
  # verified here. Invite *expiry* would therefore be invisible to CI, which is
  # how a temporary Discord invite reached the live site — so that one case is
  # covered instead by test/config.test.mjs, which asks Discord's API whether
  # the invite expires (tracker#20).
  "https://discord\\.gg/.*",
  "https://t\\.me/.*",
]
